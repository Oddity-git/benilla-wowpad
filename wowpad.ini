; wowpad settings for benilla-wowpad. Lives in benilla-config. Every key is optional.
; Restart the game after editing.
; Pad button names: A B X Y LB RB Start Back LStick RStick DPadUp DPadDown DPadLeft DPadRight, or None

[Input]
; Radial stick deadzone, fraction of full deflection (0.0-0.9)
StickDeadzone=0.24
; Trigger threshold, fraction of full pull (0.0-0.9)
TriggerThreshold=0.12
; Pads the input library has no mapping for (8BitDo Ultimate 2, Steam Controller 2026, ...)
; report their raw Linux layout: triggers as extra axes and X / Y swapped. auto notices it the
; first time a trigger moves; on or off forces it.
RawLayout=auto
; X and Y swapped: auto swaps them with the raw layout, except on Steam's virtual pad (Steam
; Input), whose buttons already arrive in place. on or off forces it.
SwapXY=auto

[Mode]
; Real mouse movement (pixels) that switches to desktop mode
MouseTravel=40
; Back held this long (ms) = bags instead of map
BackHoldMs=400

[Move]
; Per-axis press/release points, after the deadzone (0-1)
PressAt=0.40
ReleaseAt=0.30
; Walk/run option (WowPad options, experimental): stick tilt below
; WalkBelow walks, above RunAbove runs; WalkDelayMs avoids a walk blip when pushing to full.
WalkBelow=0.60
RunAbove=0.80
WalkDelayMs=150

[Cursor]
; Right stick while the pointer is visible, pixels per second at full deflection
Speed=1200
; 1.0 = linear, 2.0 = fine control near the centre, fast at the edge
Curve=2.0
; Hold this to slow the pointer down (or None)
PrecisionButton=None
PrecisionScale=0.35

[Camera]
; Right stick while the camera is active, pixels per second at full deflection
Speed=1000
InvertY=0
; LB+RB held: right stick zooms. Zoom steps per second at full deflection
ZoomSpeed=8
; Crosshair height above the window centre, in pixels at 1080 high
CrosshairY=95
; Right stick resting this long (ms) pauses camera look so the crosshair can
; show tooltips ("peek"). 0 = off (or /wp peek in game)
PeekDelayMs=250
; Smooth camera option (WowPad options): smoothing time in ms (10-300).
SmoothMs=60

[Click]
; Trigger press/release points (0-1): set switching, and clicks in pointer mode
PressAt=0.50
ReleaseAt=0.35
